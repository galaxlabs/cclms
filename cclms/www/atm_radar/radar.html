{% extends "templates/web.html" %}
{% block page_content %}

<div class="container-fluid">
  <h3>ATM Radar</h3>
  <div class="table-responsive" style="overflow-x: auto; width: 100%">
      <table id="atmRadarTable" class="table table-bordered table-striped" style="table-layout: auto; white-space: nowrap">
          <thead class="thead-dark"></thead>
          <tbody></tbody>
          <tfoot class="font-weight-bold"></tfoot>
      </table>
  </div>
<div id="map" style="height: 600px;"></div>

<script>
  var map = L.map('map').setView([37.8, -96], 4);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
  }).addTo(map);

  frappe.call({
    method: "atm_leads.api.get_locations", // you’ll make this
    callback: function(r) {
      r.message.forEach(loc => {
        var color = loc.best_fit ? "green" : "red";
        var circle = L.circle([loc.lat, loc.lng], {
          color: color,
          fillColor: color,
          fillOpacity: 0.5,
          radius: 500
        }).addTo(map);

        circle.bindPopup(`
          <b>${loc.business_name}</b><br>
          ${loc.city}, ${loc.state_code}<br>
          <button onclick="createATMLead('${loc.zip}')">Create ATM Lead</button>
        `);
      });
    }
  });

  function createATMLead(zip) {
    frappe.call({
      method: "atm_leads.api.create_lead_from_map",
      args: { zip: zip },
      callback: function(r) {
        frappe.msgprint("ATM Lead Created: " + r.message.name);
      }
    });
  }
</script>

<style>
 
</style>

{% endblock %}
