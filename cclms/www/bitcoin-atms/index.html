<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ATM Radar (USA)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google MarkerClusterer -->
    <script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>
    <style>
      #map { min-height: calc(100vh - 220px); }
      @media (min-width: 1024px){ #map { min-height: calc(100vh - 160px); } }
      .gmap-badge { font-size: 11px; color: #6b7280; }
    </style>
  </head>
  <body class="bg-slate-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
      <h1 class="text-2xl font-semibold text-slate-800 mb-4">Bitcoin ATM Radar (USA)</h1>

      <!-- Controls -->
      <div class="bg-white ring-1 ring-slate-200 rounded-2xl shadow-sm p-4 mb-4">
        <div class="grid grid-cols-1 lg:grid-cols-6 gap-3 items-end">
          <div class="lg:col-span-2">
            <label class="text-sm text-slate-500 mb-1 block">US State</label>
            <select id="state_sel"
              class="w-full h-10 rounded-xl border border-slate-200 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="" selected disabled>Choose a state…</option>
            </select>
          </div>

          <div>
            <label class="text-sm text-slate-500 mb-1 block">Overlays</label>
            <div class="flex flex-wrap gap-3">
              <label class="inline-flex items-center gap-2">
                <input id="show_leads" type="checkbox" class="h-4 w-4" checked />
                <span>My Leads</span>
              </label>
              <label class="inline-flex items-center gap-2">
                <input id="show_public" type="checkbox" class="h-4 w-4" checked />
                <span>Public ATMs</span>
              </label>
            </div>
          </div>

          <button id="btn_load"
            class="h-10 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-medium">Load State</button>

          <div class="lg:col-span-2">
            <div id="status" class="text-sm text-slate-500"></div>
          </div>
        </div>
      </div>

      <!-- Layout -->
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
        <div class="lg:col-span-3">
          <div id="map" class="bg-white ring-1 ring-slate-200 rounded-2xl overflow-hidden"></div>
        </div>
        <aside class="lg:col-span-1">
          <div class="bg-white ring-1 ring-slate-200 rounded-2xl shadow-sm p-3">
            <h2 class="text-base font-semibold text-slate-800 mb-2">Results</h2>
            <ul id="list" class="space-y-2 max-h-[calc(100vh-300px)] overflow-auto pr-1"></ul>
          </div>
        </aside>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
